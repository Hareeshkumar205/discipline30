<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>discipline30</title>
    <style>
      :root {
        --bg: #f5f7f2;
        --card: #ffffff;
        --ink: #111827;
        --muted: #4b5563;
        --accent: #2f7d32;
        --accent-soft: #e8f5e9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg), #eef5ee);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .card {
        width: min(92vw, 760px);
        background: var(--card);
        border: 1px solid #dfe8dd;
        border-radius: 18px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        padding: 2.25rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }
      p {
        color: var(--muted);
        margin: 0.6rem 0;
        font-size: 1.05rem;
      }
      .pill {
        display: inline-block;
        background: var(--accent-soft);
        color: var(--accent);
        border: 1px solid #cfe8d2;
        padding: 0.5rem 0.9rem;
        border-radius: 999px;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      code {
        background: #f3f4f6;
        padding: 0.15rem 0.35rem;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="pill">discipline30</div>
      <h1>30 Days of Discipline</h1>
      <p>A 30 day challenge focused on GYM and Gita.</p>
      <p>This repository is ready to be published with GitHub Pages.</p>
      <p>GitHub Pages URL: <code>https://Hareeshkumar205.github.io/discipline30/</code></p>
    </main>
  </body>
</html>
